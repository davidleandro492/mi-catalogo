<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<style>
:root{--bg:#eef1f7;--veil:rgba(238,241,247,.78);--ink:#14213d;--mute:#5b6783;--card:#fff;--acc:#2f5bff;--line:#d5dbe8;--bad:#d62839}
@media(prefers-color-scheme:dark){:root{--bg:#0f1526;--veil:rgba(15,21,38,.78);--ink:#e8ecf8;--mute:#9aa6c4;--card:#18203a;--acc:#7b95ff;--line:#2a3558;--bad:#ff6b7a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
#bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
#bgimg::after{content:'';position:absolute;inset:0;background:var(--veil)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 5vw;border-bottom:2px solid var(--ink)}
h1{margin:0;font-size:1.7rem;font-weight:900;letter-spacing:-.02em}
.hr{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);padding:6px 14px;border-radius:8px;font-weight:600}
button:hover{background:var(--ink);color:var(--bg)}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding:28px 5vw 48px}
.tile{position:relative;aspect-ratio:16/10;border-radius:16px;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.tile .open{all:unset;cursor:pointer;position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box}
.tile .open span{font-size:2rem;font-weight:900;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.tile .open small{opacity:.9}
#sec{padding:20px 5vw 48px}
#sec h2{margin:0 0 12px;font-size:2rem;font-weight:900}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 220px;max-width:360px;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--card);font:inherit;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border-radius:99px;padding:4px 14px;border-color:var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:block;width:100%;font-weight:400}
.card:hover{border-color:var(--acc);background:var(--card);color:inherit}
.cover{aspect-ratio:3/4;display:grid;place-items:center;color:#fff;font-size:3rem;font-weight:900;background-size:cover;background-position:center;position:relative}
.price{position:absolute;right:0;bottom:12px;background:#ffd23f;color:#14213d;font-weight:800;padding:3px 12px 3px 14px;border-radius:99px 0 0 99px}
.info{padding:10px 14px 14px}.info b{display:block;line-height:1.25}.info small{color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:48px 0}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(720px,calc(94vw / var(--z,1)));max-height:calc(92vh / var(--z,1))}
dialog::backdrop{background:rgba(10,15,30,.6)}
.dbody{padding:22px;display:grid;gap:14px}
.top{display:grid;grid-template-columns:150px 1fr;gap:18px}
.top .cover{border-radius:10px;font-size:2.4rem}
.top h2{margin:0 0 4px;font-size:1.6rem;line-height:1.2}
.big{display:inline-block;background:#ffd23f;color:#14213d;font-weight:900;font-size:1.5rem;padding:2px 16px;border-radius:99px;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.reqs div,.box{border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.reqs h3,.box h3{margin:0 0 4px;font-size:1rem}
.reqs p,.desc,.box p{margin:0;white-space:pre-line}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
label{display:grid;gap:3px;font-weight:600;font-size:.92rem}
label input{padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400;font:inherit;color:inherit}
.wa{display:inline-block;background:#25d366;color:#0b2e1a;font-weight:700;text-decoration:none;padding:7px 16px;border-radius:8px;border:2px solid #1da851}
.st{position:absolute;right:8px;top:8px;font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:99px;color:#fff}
.st-ok{background:#15803d}.st-no{background:#c81e2e}.st-soon{background:#ffc107;color:#14213d}
.st.inl{position:static;display:inline-block;margin-left:10px;vertical-align:middle;font-size:.85rem}
.cn{display:inline-block;min-width:1.4em;text-align:center;background:var(--acc);color:#fff;border-radius:99px;font-size:.8rem;padding:0 6px;margin-left:4px}
.crow{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.thumb{aspect-ratio:3/4;border-radius:6px;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-weight:900}
.cinfo small{color:var(--mute)}.cprice{font-weight:800}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;font-size:1.6rem;font-weight:900}
.addr{margin:0;padding:10px 14px;border:2px dashed var(--line);border-radius:10px;font-size:.92rem}
.waf{position:fixed;right:16px;bottom:16px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.new{position:absolute;left:8px;top:8px;background:var(--acc);color:#fff;font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:99px}
@media(max-width:700px){
  header{flex-direction:column;align-items:flex-start;padding:12px 4vw;gap:8px}
  .hr{width:100%;justify-content:flex-start}
  h1{font-size:1.3rem}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px 3vw 32px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  #sec{padding:16px 3vw 32px}
  #sec h2{font-size:1.5rem}
  .tile .open span{font-size:1.4rem}
  .tile .open small{font-size:.8rem}
  .cover{font-size:2rem}
  .info{padding:8px 10px 10px}
  .info b{font-size:.92rem}
  .price{font-size:.85rem;padding:2px 10px 2px 12px}
  .chip{padding:3px 10px;font-size:.85rem}
  .bar input[type=search]{max-width:100%}
}
@media(max-width:560px){
  .top,.reqs{grid-template-columns:1fr}
  .top .cover{max-width:150px}
  .dbody{padding:16px;gap:10px}
  .top h2{font-size:1.2rem}
  .big{font-size:1.1rem;padding:2px 12px}
  dialog{width:96vw;max-height:94vh}
  .facts{gap:4px 14px;font-size:.88rem}
  .reqs div,.box{padding:8px 10px}
  .crow{grid-template-columns:40px 1fr auto;gap:8px}
}
@media(max-width:420px){
  header{padding:10px 3vw;gap:6px}
  h1{font-size:1.1rem}
  button{padding:5px 10px;font-size:.88rem}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 2vw 24px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile .open span{font-size:1.2rem}
  .tile .open small{font-size:.75rem}
  .cover{font-size:1.6rem}
  .info b{font-size:.85rem}
  .info small{font-size:.75rem}
  .st{font-size:.65rem;padding:1px 6px}
  .new{font-size:.65rem;padding:1px 6px}
  .chip{padding:3px 9px;font-size:.8rem}
  .price{font-size:.78rem;padding:2px 8px 2px 10px;bottom:8px}
  .waf{right:10px;bottom:10px;padding:6px 12px;font-size:.85rem}
}
@media(max-width:320px){.grid{grid-template-columns:1fr;gap:10px}}
</style>
</head>
<body>
<div id="bgimg" hidden></div>
<header>
  <h1>Catálogo</h1>
  <div class="hr">
    <button id="back" hidden>Volver al inicio</button>
    <button id="zOut">A−</button>
    <button id="zIn">A+</button>
    <button id="ordBtn">Hacer pedidos</button>
    <button id="cartBtn">Carrito <span class="cn" id="cartN">0</span></button>
  </div>
</header>

<main id="home"><div class="tiles" id="tiles"></div></main>

<main id="sec" hidden>
  <h2 id="secTitle"></h2>
  <div class="bar"><input type="search" id="q" placeholder="Buscar"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="detail"><div class="dbody" id="detailBody"></div></dialog>
<dialog id="ordD"><div class="dbody"><h2 style="margin:0">Hacer pedido</h2><p style="margin:0">Se te dirigirá a WhatsApp para que hagas el pedido del multimedia que no esté disponible.</p><div class="row"><button type="button" data-x="ordD">Cancelar</button><a class="wa" id="ordGo" href="#" target="_blank" rel="noopener">Continuar a WhatsApp</a></div></div></dialog>
<dialog id="cartD"><div class="dbody"><h2 style="margin:0">Tu carrito</h2><div id="cartList"></div><div id="cartFoot" class="dbody" style="padding:0"></div><div class="row"><button class="main" data-x="cartD">Seguir viendo</button></div></div></dialog>

<a class="wa waf" href="https://wa.me/5359692806?text=Hola%2C%20quiero%20hacer%20una%20pregunta" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>

<script>
const WA="5359692806";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=p=>'$'+Number(p).toFixed(2);
const ini=t=>String(t||'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const catsOf=g=>String(g.category||'').split(',').map(s=>s.trim()).filter(Boolean);
const grad=t=>{let h=0;for(const c of String(t||'x'))h=(h*31+c.charCodeAt(0))%360;return 'background:linear-gradient(135deg,hsl('+h+' 65% 45%),hsl('+((h+50)%360)+' 65% 28%))'};
const pic=g=>g.img||(g.kind==='chapter'?(db.items.find(x=>x.kind!=='chapter'&&x.title.toLowerCase()===(g.serie||'').toLowerCase())||{}).img:'')||'';
const cover=g=>pic(g)?"background-image:url('"+pic(g)+"')":grad(g.title);
const STATUS={ok:['Disponible'],no:['No disponible'],soon:['Próximamente']};
const st=g=>g.status||'ok';
const badge=g=>'<span class="st st-'+st(g)+'">'+STATUS[st(g)][0]+'</span>';
const count=s=>s.type==='latest'?latestOf(s).length:db.items.filter(i=>i.sec===s.id).length;
const latestOf=s=>db.items.filter(g=>g.latest&&(g.kind!=='chapter'||g.sec===s.id)).sort((a,b)=>(b.at||0)-(a.at||0));
const sub=(g,L)=>L?(g.kind==='chapter'?'Capítulo nuevo':((db.sections.find(x=>x.id===g.sec)||{}).name||'')):[catsOf(g).join(', '),g.year].filter(Boolean).join(' · ');

let db=null,cur=null,cat='Todos',q='',secPushed=false;
const sec=()=>db.sections.find(s=>s.id===cur);
let cart=[];try{cart=JSON.parse(localStorage.getItem('catalogo_carrito'))||[]}catch(e){}
const saveCart=()=>{try{localStorage.setItem('catalogo_carrito',JSON.stringify(cart))}catch(e){}};
const cartItems=()=>cart.map(id=>db.items.find(x=>x.id===id)).filter(g=>g&&st(g)==='ok');
const updCart=()=>{$('#cartN').textContent=cartItems().length};
let custName='';try{custName=localStorage.getItem('catalogo_nombre')||''}catch(e){}
const waLink=()=>{const L=cartItems(),tot=L.reduce((a,g)=>a+Number(g.price||0),0);
  const msg=(custName?'Hola, soy '+custName+'. Quiero hacer este pedido:':'Hola, quiero hacer este pedido:')+'\n'+L.map(g=>'- '+g.title+' — '+money(g.price)).join('\n')+'\nTotal: '+money(tot);
  return 'https://wa.me/'+WA+'?text='+encodeURIComponent(msg)};

function render(){updCart();
  $('#home').hidden=!!cur;$('#sec').hidden=!cur;$('#back').hidden=!cur;
  const b=(cur&&sec().bg)||db.bg;
  $('#bgimg').hidden=!b;$('#bgimg').style.backgroundImage=b?"url('"+b+"')":'';
  cur?renderSec():renderHome();
}
function renderHome(){
  $('#tiles').innerHTML=[...db.sections].sort((a,b)=>(b.type==='latest')-(a.type==='latest')).map(s=>{
    const n=count(s);
    const stl=s.img?("background-image:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.05) 65%),url('"+s.img+"')"):grad(s.name);
    return '<div class="tile" style="'+stl+'">'
      +'<button class="open" data-open="'+s.id+'"><span>'+esc(s.name)+'</span><small>'+n+' '+(n===1?'título':'títulos')+'</small></button>'
      +'</div>'}).join('');
}
function renderSec(){
  const s=sec(),L=s.type==='latest';$('#secTitle').textContent=s.name;
  $('#chips').hidden=L;
  const cats=['Todos',...(s.cats||[])];if(!cats.includes(cat))cat='Todos';
  $('#chips').innerHTML=cats.map(c=>'<button class="chip'+(c===cat?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');
  const base=L?latestOf(s):db.items.filter(g=>g.sec===cur&&(cat==='Todos'||catsOf(g).includes(cat)));
  const list=base.filter(g=>g.title.toLowerCase().includes(q));
  $('#grid').innerHTML=list.length?list.map(g=>'<button class="card" data-id="'+g.id+'">'
      +'<div class="cover" style="'+cover(g)+'">'+(pic(g)?'':esc(ini(g.title)))+(g.latest?'<span class="new">Nuevo</span>':'')+badge(g)+'<span class="price">'+money(g.price)+'</span></div>'
      +'<div class="info"><b>'+esc(g.title)+'</b><small>'+esc(sub(g,L))+'</small></div>'
      +'</button>').join(''):'<p class="empty">'+(base.length?'No hay títulos con ese filtro.':'Esta sección está vacía.')+'</p>';
}
function openDetail(id){
  const g=db.items.find(x=>x.id===id);if(!g)return;
  const s=db.sections.find(x=>x.id===g.sec)||{},t=g.kind==='chapter'?'chapter':s.type;
  const facts=[['Plataforma',g.platform],['Año',g.year],['Duración',g.duration],['Almacenamiento',g.size]].filter(f=>f[1]);
  const inC=cart.includes(g.id),av=st(g)==='ok';
  $('#detailBody').innerHTML=
    '<div class="top"><div class="cover" style="'+cover(g)+'">'+(pic(g)?'':esc(ini(g.title)))+'</div>'
      +'<div><h2>'+esc(g.title)+'</h2><small>'+(g.kind==='chapter'?'Capítulo nuevo':esc(catsOf(g).join(', ')))+'</small><br><span class="big">'+money(g.price)+'</span><span class="st inl st-'+st(g)+'">'+STATUS[st(g)][0]+'</span></div></div>'
    +(facts.length?'<p class="facts">'+facts.map(f=>'<span><b>'+f[0]+':</b> '+esc(f[1])+'</span>').join('')+'</p>':'')
    +(g.desc?'<p class="desc">'+esc(g.desc)+'</p>':'')
    +(t==='game'?'<div class="reqs"><div><h3>Requisitos mínimos</h3><p>'+(esc(g.min)||'Sin datos')+'</p></div><div><h3>Requisitos recomendados</h3><p>'+(esc(g.rec)||'Sin datos')+'</p></div></div>':'')
    +(t==='basic'&&g.details?'<div class="box"><h3>Detalles</h3><p>'+esc(g.details)+'</p></div>':'')
    +'<div class="row">'
      +(av?'<button class="main" data-cart="'+g.id+'">'+(inC?'Quitar del carrito':'Añadir al carrito')+'</button>':'<button class="main" data-order="'+g.id+'">Hacer pedido</button>')
      +'<button data-x="detail">Cerrar</button>'
    +'</div>';
  $('#detail').showModal();
  requestAnimationFrame(()=>{$('#detail').scrollTop=0;const body=$('#detailBody');if(body)body.scrollTop=0});
}
function renderCart(){
  const L=cartItems(),tot=L.reduce((a,g)=>a+Number(g.price||0),0);
  $('#cartList').innerHTML=L.length?L.map(g=>'<div class="crow"><div class="thumb" style="'+cover(g)+'">'+(pic(g)?'':esc(ini(g.title)))+'</div><div class="cinfo"><b>'+esc(g.title)+'</b><br><small>'+esc(g.kind==='chapter'?'Capítulo nuevo':sub(g,false))+'</small></div><span class="cprice">'+money(g.price)+'</span><button class="del" data-rmc="'+g.id+'" aria-label="Quitar">×</button></div>').join(''):'<p class="empty" style="padding:24px 0">Tu carrito está vacío. Abre un título y pulsa "Añadir al carrito".</p>';
  $('#cartFoot').innerHTML=(L.length?'<div class="ctotal"><span>Total</span><span>'+money(tot)+'</span></div><label>Nombre (opcional)<input id="cname" maxlength="40" autocomplete="off" value="'+esc(custName)+'"></label><div class="row"><button data-clearc="1">Vaciar carrito</button><a class="wa" id="waOrder" href="'+waLink()+'" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a></div>':'')+'<p class="addr"><b>Dirección del local</b><br>Calle 86 número 10318, entre 103 y 105, en alto.<br>Referencia: casa contigua al Comité Militar.</p>';
}
function openOrder(g){
  const msg=g?'Hola, quisiera hacer un pedido de: '+g.title+' ('+STATUS[st(g)][0]+')':'Hola, quisiera hacer un pedido de un multimedia que no está disponible en el catálogo:';
  $('#ordGo').href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);$('#ordD').showModal();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button')||(e.target.matches('dialog')?e.target:null);if(!t)return;
  const d=t.dataset;
  if(d.x)$('#'+d.x).close();
  else if(t===$('#detail')||t===$('#cartD'))t.close();
  else if(d.open){cur=d.open;cat='Todos';q='';$('#q').value='';try{history.pushState({c:1},'');secPushed=true}catch(_){};render()}
  else if(d.cat){cat=d.cat;renderSec()}
  else if(d.id)openDetail(d.id);
  else if(d.cart){const i=cart.indexOf(d.cart);i<0?cart.push(d.cart):cart.splice(i,1);saveCart();updCart();t.textContent=i<0?'Quitar del carrito':'Añadir al carrito'}
  else if(d.order){$('#detail').close();openOrder(db.items.find(x=>x.id===d.order))}
  else if(d.rmc){cart=cart.filter(x=>x!==d.rmc);saveCart();updCart();renderCart()}
  else if(d.clearc){cart=[];saveCart();updCart();renderCart()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value.toLowerCase().trim();renderSec()}
  if(e.target.id==='cname'){custName=e.target.value.trim();try{localStorage.setItem('catalogo_nombre',custName)}catch(_){};$('#waOrder').href=waLink()}
});
$('#back').onclick=()=>goHome();
function goHome(){if(cur){cur=null;render();if(secPushed){secPushed=false;try{history.back()}catch(e){}}}}
addEventListener('popstate',()=>{
  const d=[...document.querySelectorAll('dialog[open]')].pop();
  if(d){d.close();return}
  if(cur){secPushed=false;cur=null;render()}
});
$('#cartBtn').onclick=()=>{renderCart();$('#cartD').showModal()};
$('#ordBtn').onclick=()=>openOrder(null);
$('#ordGo').addEventListener('click',()=>$('#ordD').close());

const ZS=[.8,.9,1,1.15,1.3,1.5];let zi=2;
try{const v=parseInt(localStorage.getItem('catalogo_zoom'));if(v>=0&&v<ZS.length)zi=v}catch(e){}
function applyZ(){const z=ZS[zi];document.documentElement.style.zoom=z;document.documentElement.style.setProperty('--z',z);try{localStorage.setItem('catalogo_zoom',zi)}catch(e){}}
if(window.CSS&&CSS.supports&&CSS.supports('zoom','1.1'))applyZ();else{const o=$('#zOut'),i=$('#zIn');if(o)o.hidden=true;if(i)i.hidden=true}
$('#zOut').onclick=()=>{if(zi>0){zi--;applyZ()}};
$('#zIn').onclick=()=>{if(zi<ZS.length-1){zi++;applyZ()}};

(async()=>{
  try{
    const r=await fetch('datos.json?_='+Date.now());
    if(!r.ok)throw new Error('No se pudo cargar datos.json');
    const data=await r.json();
    if(data.sections&&data.items)db=data;else throw new Error('Datos inválidos');
  }catch(e){
    console.warn('Sin datos.json:',e);
    db={sections:[],items:[]};
    document.getElementById('grid').innerHTML='<p class="empty">No se pudieron cargar los datos. Recarga la página.</p>';
  }
  render();
})();
</script>
</body>
</html>
